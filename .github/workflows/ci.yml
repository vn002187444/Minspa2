name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop, v3-dev]
  pull_request:
    branches: [main, develop, v3-dev]

jobs:
  quality:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit (non-blocking - xlsx known high)
        run: npm audit --audit-level=high || echo "audit warnings present (xlsx) - non-blocking"
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings=50 || npx next lint || echo "lint warnings"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  security:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    env:
      JWT_SECRET: ci-dummy-jwt-secret-for-build-only-32chars-long
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key-for-build-12345
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-key-for-build-12345
      CRON_SECRET: ci-dummy-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .next

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    # Disabled: Vercel native GitHub integration already auto-deploys on push to main.
    # Keep job as placeholder but skip execution to avoid "Project name" 400 error when VERCEL_ORG_ID not set.
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
